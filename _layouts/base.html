<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.add('js');
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {%- assign page_title = page.title | default: "Writing" %}
  {%- assign page_desc = page.description | default: site.description %}
  <title>{{ page_title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page_desc | strip_html | strip_newlines | escape }}" />
  <meta property="og:title" content="{{ page_title | escape }}" />
  <meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | escape }}" />
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="https://debanjanm.github.io/assets/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Debanjan Mondal — Senior AI Engineer. Statistics, Data Science, AI Engineering." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Writing" href="{{ '/writing/feed.xml' | relative_url }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="{{ '/' | relative_url }}">Debanjan Mondal<span>.</span></a>
    <div class="nav-right">
      <ul class="nav-links keep">
        <li><a href="{{ '/#platforms' | relative_url }}">Work</a></li>
        <li><a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing/' %} class="active"{% endif %}>Writing</a></li>
      </ul>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light or dark theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="page-wrap">
{{ content }}
  </div>
</main>

<footer>
  <div class="foot-inner">
    <span class="mono">© {{ site.time | date: "%Y" }} Debanjan Mondal</span>
    <a class="mono" href="{{ '/writing/feed.xml' | relative_url }}" style="text-decoration:none">RSS</a>
  </div>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
