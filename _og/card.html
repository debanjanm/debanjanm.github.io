<!DOCTYPE html>
<!-- Source for assets/og-card.png (1200x630) — also the LinkedIn Featured thumbnail.
     Shown at ~300-360px wide, directly under/beside the name, so: no name, big type only.
     Not published: Jekyll skips _og/. Regenerate with the command in _og/README.md. -->
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0c0c0d; color: #ececec;
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    padding: 64px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .mono {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .label { color: #e8590c; }
  .url { color: #82828a; letter-spacing: 0.06em; text-transform: none; }

  .arc { display: flex; flex-direction: column; gap: 6px; }
  .step {
    font-weight: 300; font-size: 88px; line-height: 1.04; letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 30px;
  }
  .step::before { content: ''; width: 44px; height: 3px; background: #3a3a3f; flex: none; }
  .step:nth-child(2) { margin-left: 120px; }
  .step:nth-child(3) { margin-left: 240px; color: #e8590c; }
  .step:nth-child(3)::before { background: #e8590c; }

  .tag {
    font-weight: 300; font-style: italic; font-size: 38px; line-height: 1.3;
    color: #b4b4b8;
  }
</style>
</head>
<body>
  <div class="top">
    <span class="mono label">Portfolio</span>
    <span class="mono url">debanjanm.github.io</span>
  </div>
  <div class="arc">
    <div class="step">Statistics</div>
    <div class="step">Data Science</div>
    <div class="step">AI Engineering</div>
  </div>
  <p class="tag">Architecture, decisions, and the evaluation behind them.</p>
</body>
</html>
