<!DOCTYPE html>
<!-- Source for assets/og-card.png (1200x630). Not published: Jekyll skips _og/.
     Regenerate with the command in _og/README.md. -->
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0c0c0d; color: #ececec;
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    padding: 72px 84px 64px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #82828a;
  }
  .meta { display: flex; align-items: center; gap: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e8590c;
         box-shadow: 0 0 0 5px rgba(232,89,12,0.18); }
  h1 {
    font-weight: 300; font-size: 122px; line-height: 1;
    letter-spacing: -0.035em; margin-top: 34px;
  }
  h1 span { color: #e8590c; }
  .thesis {
    font-weight: 300; font-style: italic; font-size: 34px; line-height: 1.35;
    color: #b4b4b8; margin-top: 26px; max-width: 900px;
  }
  .arc {
    margin-top: auto;
    display: grid; grid-template-columns: repeat(3, 250px);
    border-top: 1px solid #2a2a2e;
  }
  .step { padding-top: 20px; position: relative; }
  .step::before { content: ''; position: absolute; top: -1px; left: 0;
                  width: 46px; height: 2px; background: #e8590c; }
  .step .mono { font-size: 15px; display: block; margin-bottom: 8px; }
  .step .nm { font-size: 30px; }
  .step:last-child .nm { color: #e8590c; }
  .url {
    position: absolute; right: 84px; bottom: 64px;
    font-family: 'JetBrains Mono', monospace; font-size: 18px;
    letter-spacing: 0.04em; color: #ececec;
  }
  .url::after { content: ' ↗'; color: #e8590c; }
</style>
</head>
<body>
  <div class="meta">
    <span class="dot"></span>
    <span class="mono">Senior AI Engineer · Standard Chartered GBS</span>
  </div>
  <h1>Debanjan Mondal<span>.</span></h1>
  <p class="thesis">Is this result real — and will it hold in production?</p>
  <div class="arc">
    <div class="step"><span class="mono">2015 — 2020</span><span class="nm">Statistics</span></div>
    <div class="step"><span class="mono">2019 — 2021</span><span class="nm">Data Science</span></div>
    <div class="step"><span class="mono">2021 — Now</span><span class="nm">AI Engineering</span></div>
  </div>
  <div class="url">debanjanm.github.io</div>
</body>
</html>
